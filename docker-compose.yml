# ──────────────────────────────────────────────────────────────────────────────
# docker-compose.yml
#
# Prerequisites:
#   1. Copy  backend/.env.example  →  backend/.env  and fill in all secrets.
#   2. Copy  .env.example          →  .env          and set MONGO/REDIS passwords.
#   3. Place Cloudflare Origin CA certs in nginx/certs/ (see nginx/certs/README.txt).
#   4. Run:  docker compose up --build -d
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS}
      MONGO_INITDB_DATABASE: ${MONGODB_DB_NAME:-crypto_db}
    # wiredTigerCacheSizeGB = ~50% of RAM reserved for Mongo (adjust to your VPS)
    # net.maxIncomingConnections covers PM2 cluster workers × pool size
    command: >
      mongod
      --wiredTigerCacheSizeGB 4
      --maxConns 2000
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network
    deploy:
      resources:
        reservations:
          memory: 1G
        limits:
          memory: 6G
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --tcp-backlog 1024
      --tcp-keepalive 60
      --timeout 300
      --hz 20
    volumes:
      - redis_data:/data
    networks:
      - app_network
    deploy:
      resources:
        reservations:
          memory: 256M
        limits:
          memory: 1.5G
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Backend (Node.js + PM2 cluster) ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    env_file:
      - ./backend/.env         # All backend secrets (JWT, session, wallets, etc.)
    environment:
      NODE_ENV: production
      # Override connection strings to use Docker service hostnames
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MONGO_URI: >-
        mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASS}@mongo:27017/${MONGODB_DB_NAME:-crypto_db}?authSource=admin
    volumes:
      - uploads_data:/app/uploads   # Persist user uploads across rebuilds
    networks:
      - app_network
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          memory: 512M
        limits:
          memory: 3G
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Nginx (Frontend + Reverse Proxy + SSL) ────────────────────────────────────
  nginx:
    build:
      context: .                    # Build context is repo root (needs frontend/ and nginx/)
      dockerfile: nginx/Dockerfile
    container_name: nginx
    restart: unless-stopped
    ports:
      # Non-standard ports — Cloudflare supports 8080 (HTTP) and 8443 (HTTPS) as origin ports.
      # Direct port scans on 80/443 find nothing. Only Cloudflare IPs can reach these.
      # Lock down further with UFW to allow only Cloudflare IPs.
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro   # Bind-mount Cloudflare Origin CA certs
    networks:
      - app_network
    # Increase OS-level file descriptor limit inside the nginx container
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        reservations:
          memory: 128M
        limits:
          memory: 512M
    depends_on:
      backend:
        condition: service_healthy

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  mongo_data:
  redis_data:
  uploads_data:

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  app_network:
    driver: bridge

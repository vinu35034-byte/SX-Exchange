user  nginx;
worker_processes  auto;

# Allow each worker to open up to 65535 file descriptors
# (each connection = 2 FDs: client + upstream)
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    # 16384 conns × auto workers → well above 10k concurrent users
    worker_connections  16384;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # ── Performance ────────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  75;     # keep client connections alive longer
    keepalive_requests 10000;  # reuse a connection for up to 10k requests
    types_hash_max_size 2048;
    server_tokens off;

    # ── Proxy buffers (prevents disk-buffering for fast backend responses) ──────
    proxy_buffering          on;
    proxy_buffer_size        16k;
    proxy_buffers            8 32k;
    proxy_busy_buffers_size  64k;

    # ── Rate limiting zones (shared memory) ────────────────────────────────────
    # 10m stores ~160k IP entries; burst gives headroom for mobile reconnects
    limit_req_zone  $binary_remote_addr zone=api_limit:10m    rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=auth_limit:10m   rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── Open file cache (avoids repeated stat() for static assets) ─────────────
    open_file_cache          max=20000 inactive=30s;
    open_file_cache_valid    60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # ── Gzip ───────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/xml image/svg+xml
        application/x-font-ttf font/opentype;

    # ── Cloudflare Real IP Restoration ─────────────────────────────────────────
    # Keep these ranges updated: https://www.cloudflare.com/ips/
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    # IPv6
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    real_ip_header CF-Connecting-IP;

    # ── Upstream: Node.js backend ───────────────────────────────────────────────
    upstream backend {
        server backend:5001;
        # Keep 256 idle keep-alive connections to the backend pool
        # (PM2 cluster workers share port 5001 via Node cluster)
        keepalive 256;
        keepalive_requests 10000;
        keepalive_timeout  75s;
    }

    # ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
    server {
        listen 8080;
        server_name nexabitexchange.pro www.nexabitexchange.pro;

        # Allow Cloudflare health checks
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host:8443$request_uri;
        }
    }

    # ── HTTPS main server ──────────────────────────────────────────────────────
    server {
        listen 8443 ssl;
        server_name nexabitexchange.pro www.nexabitexchange.pro;

        # ── Cloudflare Origin CA Certificate ───────────────────────────────────
        # Generate at: Cloudflare Dashboard → SSL/TLS → Origin Server → Create Certificate
        # Save PEM body as nginx/certs/origin.crt
        # Save PEM key  as nginx/certs/origin.key
        ssl_certificate     /etc/nginx/certs/origin.crt;
        ssl_certificate_key /etc/nginx/certs/origin.key;

        # ── TLS Hardening ───────────────────────────────────────────────────────
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_session_cache shared:SSL:50m;  # ~200k sessions @ 10k+ users
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling off; # Cloudflare Origin CA doesn't support OCSP stapling

        # ── Security Headers ────────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ── Body size ───────────────────────────────────────────────────────────
        client_max_body_size 20M;

        # ── Connection limits per IP ────────────────────────────────────────────
        limit_conn conn_limit 50;  # max 50 concurrent connections per IP

        # ── API reverse proxy ───────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # Forward cookies (session-based auth)
            proxy_pass_header  Set-Cookie;
            proxy_cookie_path  /          /;

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # ── Socket.IO WebSocket proxy ───────────────────────────────────────────
        location /socket.io/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout 7d;
            proxy_send_timeout    7d;
            proxy_read_timeout    7d;
        }

        # ── Static frontend (SPA) ────────────────────────────────────────────────
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Cache busting — Vite hashes JS/CSS filenames, so cache them aggressively
            location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;
            }
        }
    }
}

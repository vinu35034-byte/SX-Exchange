    <!-- Zoom Prevention Script -->
    <script>
      // Prevent zoom via keyboard shortcuts and mouse wheel
      (function() {
        // Prevent keyboard zoom shortcuts (Ctrl/Cmd + +, -, 0)
        document.addEventListener('keydown', function(e) {
          // Check for Ctrl+Plus, Ctrl+Minus, Ctrl+0 (Windows)
          // Check for Cmd+Plus, Cmd+Minus, Cmd+0 (Mac)
          if ((e.ctrlKey || e.metaKey) && 
              (e.keyCode === 61 || e.keyCode === 107 || e.keyCode === 173 || 
               e.keyCode === 109 || e.keyCode === 187 || e.keyCode === 189 || 
               e.keyCode === 48)) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        }, { passive: false });

        // Prevent zoom via mouse wheel + Ctrl/Cmd
        document.addEventListener('wheel', function(e) {
          if (e.ctrlKey || e.metaKey) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        }, { passive: false });

        // Prevent zoom via touch gestures (pinch-to-zoom)
        let touchStartDistance = 0;
        
        document.addEventListener('touchstart', function(e) {
          if (e.touches.length === 2) {
            touchStartDistance = Math.hypot(
              e.touches[0].pageX - e.touches[1].pageX,
              e.touches[0].pageY - e.touches[1].pageY
            );
          }
        }, { passive: false });

        document.addEventListener('touchmove', function(e) {
          if (e.touches.length === 2) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        }, { passive: false });

        // Prevent context menu which can sometimes be used for zoom
        document.addEventListener('contextmenu', function(e) {
          if (e.ctrlKey || e.metaKey) {
            e.preventDefault();
            return false;
          }
        }, { passive: false });

        // Additional prevention for browser zoom detection
        let scale = 1;
        
        function detectZoom() {
          const newScale = Math.round(window.devicePixelRatio * 100) / 100;
          if (Math.abs(newScale - scale) > 0.01) {
            scale = newScale;
            // Reset zoom by refreshing if zoom detected (optional)
            // You can uncomment the line below if you want to force refresh on zoom
            // window.location.reload();
          }
        }

        // Monitor for zoom changes
        window.addEventListener('resize', detectZoom);
        window.addEventListener('load', detectZoom);
        
        console.log('Zoom prevention system initialized');
      })();
    </script>

      window.addEventListener('load', () => {
        const root = document.getElementById('root');
        const loadingContainer = document.querySelector('.loading-container');
        
        // Check if React app has rendered
        const checkForReactApp = () => {
          if (root.children.length > 0) {
            loadingContainer.style.opacity = '0';
            loadingContainer.style.transition = 'opacity 0.5s ease';
            root.classList.add('loaded');
            
            setTimeout(() => {

            }, 500);
          } else {

        };
